<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FILER VILLA わんわんエンディング</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<style>
/* Layout: one full-screen stage, logo-colored, with a single replay control under it */
:root{
  --night:#26262a;      /* logo background */
  --night-deep:#18181b;
  --gold:#f4b300;       /* FILER VILLA gold */
  --gold-dim:#a87c06;
  --ink:#1b1b1d;
  --paper:#fff8e6;
  --round:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 45%,var(--night) 0%,var(--night-deep) 100%) fixed,var(--night-deep);
  color:var(--paper);font-family:var(--round);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box;overflow:hidden}
svg#stage{width:100%;max-width:1400px;height:auto;max-height:calc(100% - 64px);display:block;cursor:pointer}
.bar{display:flex;gap:10px;align-items:center}
button{font:800 15px/1 var(--round);color:var(--ink);background:var(--gold);border:0;border-radius:999px;padding:11px 20px;cursor:pointer;letter-spacing:.04em}
button.ghost{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold)}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.bubble text{font:800 22px var(--round)}
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 2835 1417.5" role="img" aria-label="犬たちがFILER VILLAのログハウスに入っていき、家がぴょんぴょん跳ねてロゴになるアニメーション">
  <defs>
    <clipPath id="doorClip"><rect x="117" y="289" width="42" height="58" rx="21" ry="21"/><rect x="117" y="310" width="42" height="37"/></clipPath>
  </defs>

  <!-- letters (paths taken from the FILER VILLA logo) -->
  <g id="letters" fill="var(--gold)"><g><g transform="translate(605.045,819.883659)"><path d="M 33.390625 0 L 33.390625 -320.296875 L 248.5625 -320.296875 L 248.5625 -265.71875 L 95.640625 -265.71875 L 95.640625 -183.15625 L 222.859375 -183.15625 L 222.859375 -132.625 L 95.640625 -132.625 L 95.640625 0 Z M 33.390625 0 "/></g></g><g><g transform="translate(1402.618018,806.386783)"><path d="M 30.53125 0 L 30.53125 -292.953125 L 87.46875 -292.953125 L 87.46875 -49.921875 L 236.84375 -49.921875 L 236.84375 0 Z M 30.53125 0 "/></g></g><g><g transform="translate(1742.613025,806.386783)"><path d="M 233.953125 -49.921875 L 233.953125 0 L 30.53125 0 L 30.53125 -292.953125 L 230.234375 -292.953125 L 230.234375 -243.03125 L 87.46875 -243.03125 L 87.46875 -172.46875 L 210.84375 -172.46875 L 210.84375 -126.265625 L 87.46875 -126.265625 L 87.46875 -49.921875 Z M 233.953125 -49.921875 "/></g></g><g><g transform="translate(2089.622482,806.386783)"><path d="M 30.53125 0 L 30.53125 -292.953125 L 160.09375 -292.953125 C 173.570312 -292.953125 186.019531 -290.128906 197.4375 -284.484375 C 208.851562 -278.847656 218.6875 -271.421875 226.9375 -262.203125 C 235.1875 -252.992188 241.648438 -242.539062 246.328125 -230.84375 C 251.003906 -219.15625 253.34375 -207.398438 253.34375 -195.578125 C 253.34375 -176.597656 248.597656 -159.335938 239.109375 -143.796875 C 229.617188 -128.253906 216.757812 -117.046875 200.53125 -110.171875 L 267.375 0 L 203.421875 0 L 143.59375 -98.203125 L 87.46875 -98.203125 L 87.46875 0 Z M 87.46875 -148.125 L 158.859375 -148.125 C 164.078125 -148.125 168.957031 -149.359375 173.5 -151.828125 C 178.039062 -154.304688 181.960938 -157.675781 185.265625 -161.9375 C 188.566406 -166.207031 191.175781 -171.226562 193.09375 -177 C 195.019531 -182.78125 195.984375 -188.972656 195.984375 -195.578125 C 195.984375 -202.453125 194.882812 -208.773438 192.6875 -214.546875 C 190.488281 -220.328125 187.53125 -225.347656 183.8125 -229.609375 C 180.101562 -233.878906 175.84375 -237.179688 171.03125 -239.515625 C 166.21875 -241.859375 161.332031 -243.03125 156.375 -243.03125 L 87.46875 -243.03125 Z M 87.46875 -148.125 "/></g></g></g>
  <g id="villa" fill="var(--gold)"><g><g transform="translate(986.147728,1051.687745)"><path d="M 22.109375 -106.78125 L 50.984375 -26.015625 L 79.5625 -106.78125 L 101.375 -106.78125 L 59.71875 0 L 42.265625 0 L 0.296875 -106.78125 Z M 22.109375 -106.78125 "/></g></g><g><g transform="translate(1208.141921,1051.687745)"><path d="M 11.125 0 L 11.125 -106.78125 L 31.890625 -106.78125 L 31.890625 0 Z M 11.125 0 "/></g></g><g><g transform="translate(1371.480331,1051.687745)"><path d="M 11.125 0 L 11.125 -106.78125 L 31.890625 -106.78125 L 31.890625 -18.203125 L 86.328125 -18.203125 L 86.328125 0 Z M 11.125 0 "/></g></g><g><g transform="translate(1579.637813,1051.687745)"><path d="M 11.125 0 L 11.125 -106.78125 L 31.890625 -106.78125 L 31.890625 -18.203125 L 86.328125 -18.203125 L 86.328125 0 Z M 11.125 0 "/></g></g><g><g transform="translate(1787.795294,1051.687745)"><path d="M 41.515625 -106.78125 L 59.859375 -106.78125 L 100.46875 0 L 79.109375 0 L 69.1875 -26.625 L 31.890625 -26.625 L 22.109375 0 L 0.75 0 Z M 65.421875 -41.21875 L 50.6875 -83.171875 L 35.34375 -41.21875 Z M 65.421875 -41.21875 "/></g></g></g>
  <rect id="lineL" x="348" y="1002" width="493" height="9" fill="var(--gold)"/>
  <rect id="lineR" x="2063" y="1002" width="465" height="9" fill="var(--gold)"/>

  <!-- world: log house + dogs, in house-local units -->
  <g id="world">
    <line id="ground" x1="-600" y1="346" x2="900" y2="346" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" opacity=".35"/>
    <g id="hop">
      <g id="smoke"><path d="M139,114 C122,98 160,88 150,68 C141,50 176,44 172,20" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round"/></g>
      <g id="puffs"></g>
      <g fill="var(--gold)">
        <rect x="124" y="120" width="30" height="50" rx="4"/>
        <rect x="118" y="112" width="42" height="13" rx="5"/>
      </g>
      <!-- gable -->
      <path d="M40,240 L138,174 L236,240 Z" fill="var(--ink)"/>
      <path d="M62,238 L138,186 L214,238 M86,222 H190 M108,206 H168" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="14,238 138,152 262,238" fill="none" stroke="var(--gold)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- logs -->
      <g id="logs"></g>
      <!-- window -->
      <rect x="112" y="240" width="52" height="44" rx="4" fill="var(--ink)"/>
      <g fill="var(--gold)"><rect x="117" y="244" width="19" height="16" rx="2"/><rect x="140" y="244" width="19" height="16" rx="2"/><rect x="117" y="264" width="19" height="16" rx="2"/><rect x="140" y="264" width="19" height="16" rx="2"/></g>
      <!-- door -->
      <path d="M113,348 V310 A25,25 0 0 1 163,310 V348 Z" fill="var(--ink)"/>
      <path d="M117,347 V310 A21,21 0 0 1 159,310 V347 Z" fill="#0d0d0f"/>
      <g id="door"><path d="M117,347 V310 A21,21 0 0 1 159,310 V347 Z" fill="var(--gold)"/>
        <path d="M131,296 V345 M145,296 V345" stroke="var(--gold-dim)" stroke-width="3"/>
        <circle cx="152" cy="324" r="3.2" fill="var(--ink)"/></g>
    </g>
    <g id="dogs"></g>
    <g id="fx"></g>
  </g>
</svg>
<div class="bar">
  <button id="replay" type="button">もう一度</button>
  <button id="pause" type="button" class="ghost">一時停止</button>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
const bounce=u=>{const n=7.5625,d=2.75;if(u<1/d)return n*u*u;if(u<2/d)return n*(u-=1.5/d)*u+.75;if(u<2.5/d)return n*(u-=2.25/d)*u+.9375;return n*(u-=2.625/d)*u+.984375};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const GOLD='#f4b300';

/* ---------- logs ---------- */
const logs=$('logs');let lh='';
[252,273,294,315,336].forEach(y=>{
  lh+=`<rect x="44" y="${y-8}" width="188" height="16" rx="8" fill="${GOLD}"/><rect x="56" y="${y-1.5}" width="164" height="3" rx="1.5" fill="#1b1b1d"/>`;
  lh+=`<circle cx="38" cy="${y}" r="10" fill="${GOLD}"/><circle cx="38" cy="${y}" r="3.2" fill="#1b1b1d"/>`;
  lh+=`<circle cx="238" cy="${y}" r="10" fill="${GOLD}"/><circle cx="238" cy="${y}" r="3.2" fill="#1b1b1d"/>`;
});
logs.innerHTML=lh;

/* ---------- dogs ---------- */
function dogMarkup(o){
  const L=o.L,h=o.leg,by=-(h+8),c=o.color,dk=o.dark,bl=o.belly||c;
  const leg=(cls,x,col)=>`<g class="${cls}" data-x="${x}" data-y="${by+4}"><line x1="0" y1="0" x2="0" y2="${h+4}" stroke="${col}" stroke-width="5.5" stroke-linecap="round"/></g>`;
  const tail=o.tail==='curl'
    ?`<path d="M0,0 C-11,-3 -13,-17 -3,-17 C3,-17 4,-11 0,-10" fill="none" stroke="${c}" stroke-width="5.5" stroke-linecap="round"/>`
    :o.tail==='pom'?`<line x1="0" y1="0" x2="-7" y2="-12" stroke="${c}" stroke-width="4" stroke-linecap="round"/><circle cx="-8" cy="-15" r="5.5" fill="${c}"/>`
    :`<path d="M0,0 C-8,-1 -15,-7 -18,-14" fill="none" stroke="${c}" stroke-width="5.5" stroke-linecap="round"/>`;
  const fluff=o.fluffy?[-L,-L/2,0,L/2,L].map(x=>`<circle cx="${x}" cy="${by-3}" r="8" fill="${c}"/>`).join(''):'';
  const ear=o.ear==='pointy'
    ?`<path d="M-7,-5 L-3,-19 L5,-8 Z" fill="${c}"/><path d="M-4.5,-7 L-2.6,-14 L1.5,-8.5 Z" fill="${o.inner||'#f2b8a6'}"/>`
    :`<ellipse cx="-5" cy="2" rx="5.5" ry="10" fill="${o.earColor||dk}" transform="rotate(18 -5 2)"/>`;
  return `
  <g class="tail" data-x="${-L+1}" data-y="${by-4}">${tail}</g>
  ${leg('lb2',-L*0.55,dk)}${leg('lf2',L*0.55,dk)}
  <ellipse cx="0" cy="${by}" rx="${L+3}" ry="10.5" fill="${c}"/>${fluff}
  ${o.belly?`<ellipse cx="3" cy="${by+5}" rx="${L*0.62}" ry="4.5" fill="${bl}"/>`:''}
  ${leg('lb1',-L*0.55-2,c)}${leg('lf1',L*0.55+2,c)}
  <rect x="${L-3}" y="${by-9}" width="5" height="13" rx="2.5" fill="${GOLD}"/>
  <g class="head" data-x="${L+3}" data-y="${by-12}">
    ${o.ear==='pointy'?'':ear}
    <circle r="11.5" fill="${c}"/>${o.fluffy?`<circle cx="-2" cy="-10" r="7" fill="${c}"/>`:''}
    <ellipse cx="9" cy="3.5" rx="8" ry="6" fill="${bl}"/>
    <circle cx="16.3" cy="1.4" r="2.8" fill="#222"/>
    <circle cx="4.5" cy="-3" r="2.1" fill="#222"/><circle cx="5.2" cy="-3.7" r=".7" fill="#fff"/>
    <circle cx="2" cy="4" r="2.6" fill="#ff8f7d" opacity=".55"/>
    ${o.ear==='pointy'?ear:''}
  </g>`;
}
const DOOR=138;
const DOGS=[
  {name:'しば',   color:'#d98a3a',dark:'#a8642a',belly:'#f6e7d0',ear:'pointy',tail:'curl',L:16,leg:14,s:1,   dir:1, arrive:3.0,speed:190},
  {name:'ダックス',color:'#8a5532',dark:'#5e3720',belly:'#c48a5c',ear:'floppy',tail:'straight',L:25,leg:7,s:1,dir:1,arrive:3.6,speed:170},
  {name:'プードル',color:'#efe6d6',dark:'#cbbfa9',ear:'floppy',earColor:'#e2d5bd',tail:'pom',fluffy:true,L:13,leg:14,s:.95,dir:1,arrive:4.2,speed:200},
  {name:'ゴールデン',color:'#e2b35e',dark:'#b98a3b',belly:'#f3d699',ear:'floppy',tail:'straight',L:21,leg:17,s:1.15,dir:-1,arrive:4.8,speed:180},
  {name:'こいぬ', color:'#d7cfc3',dark:'#a99f92',belly:'#fff6ea',ear:'pointy',inner:'#f3b0a4',tail:'curl',L:11,leg:10,s:.8,dir:1,arrive:6.1,speed:240,waitUntil:7.05,late:true},
];
const dogsG=$('dogs');
DOGS.forEach(d=>{
  const wrap=document.createElementNS(NS,'g');
  const g=document.createElementNS(NS,'g');
  g.innerHTML=dogMarkup(d);wrap.appendChild(g);dogsG.appendChild(wrap);
  d.wrap=wrap;d.g=g;d.parts={};
  ['lb1','lb2','lf1','lf2','tail','head'].forEach(k=>{const el=g.querySelector('.'+k);d.parts[k]={el,x:+el.dataset.x,y:+el.dataset.y}});
  d.x0=d.dir>0?-480:770;
  d.dist=Math.abs(DOOR-d.x0);
  d.start=d.arrive-d.dist/d.speed;
  d.enter=Math.max(d.arrive,d.waitUntil||0);
});
const setT=(p,a)=>p.el.setAttribute('transform',`translate(${p.x},${p.y}) rotate(${a})`);
const ENTER=0.5;
function drawDog(d,t){
  const w=d.wrap;
  if(t<d.start||t>d.enter+ENTER){w.setAttribute('visibility','hidden');return}
  w.setAttribute('visibility','visible');
  let x,y=0,k=1,op=1,walking=true;
  if(t<d.arrive){x=d.x0+d.dir*d.speed*(t-d.start)}
  else{x=DOOR;walking=false}
  const ph=(t-d.start)*d.speed/9;
  const swing=walking?Math.sin(ph)*30:0;
  setT(d.parts.lb1,swing);setT(d.parts.lf1,-swing);setT(d.parts.lb2,-swing);setT(d.parts.lf2,swing);
  setT(d.parts.tail,Math.sin(t*(walking?14:22))*16);
  let headA=walking?Math.sin(ph*2)*3:0;
  if(!walking&&t<d.enter){headA=-12+Math.sin(t*9)*4} // looking up at the door / barking
  setT(d.parts.head,headA);
  const bob=walking?-Math.abs(Math.sin(ph))*2.2:0;
  let sx=d.dir;
  if(t>=d.enter){
    const u=seg(t,d.enter,d.enter+ENTER);
    k=1-0.5*ease(u);y=-6*u;op=1-u*u;sx=d.dir*(1-0.55*u);
    w.setAttribute('clip-path','url(#doorClip)');
  }else w.removeAttribute('clip-path');
  const S=d.s*1.3;d.g.setAttribute('transform',`translate(${x},${346+bob+y}) scale(${sx*k*S},${k*S})`);
  w.setAttribute('opacity',op);
}

/* ---------- door ---------- */
const DOORKEYS=[[0,0],[2.2,0],[2.55,1],[5.45,1],[5.8,0],[6.75,0],[7.0,1],[7.7,1],[8.0,0]];
function doorAt(t){for(let i=1;i<DOORKEYS.length;i++){const[a,va]=DOORKEYS[i-1],[b,vb]=DOORKEYS[i];if(t<=b)return lerp(va,vb,ease(seg(t,a,b)))}return 0}

/* ---------- speech bubbles ---------- */
const fx=$('fx');
const BUBBLES=[ // [time, x, y, text, size]
  [6.25,70,236,'ワン！',1],[6.75,60,224,'ワンワン！',1],
  [8.75,-40,140,'ワン',1.2],[9.3,300,120,'ワン！',1.2],[9.85,40,60,'ワンワン！',1.3],
];
BUBBLES.forEach(b=>{
  const g=document.createElementNS(NS,'g');g.setAttribute('class','bubble');
  const w=b[3].length*21+22;
  g.innerHTML=`<rect x="${-w/2}" y="-20" width="${w}" height="36" rx="18" fill="#fff8e6"/><path d="M-6,14 L0,26 L8,14 Z" fill="#fff8e6"/><text y="6" text-anchor="middle" fill="#1b1b1d">${b[3]}</text>`;
  fx.appendChild(g);b.el=g;
});
function drawBubbles(t){BUBBLES.forEach(b=>{
  const u=(t-b[0])/0.9;
  if(u<0||u>1){b.el.setAttribute('visibility','hidden');return}
  b.el.setAttribute('visibility','visible');
  const pop=u<.2?bounce(u/.2):1;const s=b[4]*0.8*pop;
  b.el.setAttribute('transform',`translate(${b[1]},${b[2]-u*24}) scale(${s})`);
  b.el.setAttribute('opacity',u>.75?1-(u-.75)/.25:1);
})}

/* ---------- smoke puffs on landing ---------- */
const puffsG=$('puffs');const PUFFS=[];
for(let i=0;i<9;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('fill','#f4b300');puffsG.appendChild(c);PUFFS.push(c)}

/* ---------- house hop ---------- */
const HOPS=[[8.4,0.6,58],[9.0,0.6,58],[9.6,0.7,44]];
function hopAt(t){
  for(const[st,dur,H] of HOPS){
    const u=(t-st)/dur;
    if(u<0||u>1)continue;
    let y=0,sx=1,sy=1;
    if(u<.16){const v=Math.sin(Math.PI*u/.16);sy=1-.13*v;sx=1+.08*v}
    else if(u>.84){const v=Math.sin(Math.PI*(u-.84)/.16);sy=1-.13*v;sx=1+.08*v}
    else{const v=(u-.16)/.68;y=-H*Math.sin(Math.PI*v);sy=1+.07*Math.sin(Math.PI*v);sx=1-.04*Math.sin(Math.PI*v)}
    return{y,sx,sy};
  }
  return{y:0,sx:1,sy:1};
}

/* ---------- logo pieces ---------- */
const letters=[...$('letters').children],villa=[...$('villa').children];
const STAGE={x:1058,y:251,s:2.6},LOGO={x:904,y:258.5,s:1.505};

const END=17.5;
let t0=performance.now(),paused=false,pausedAt=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){paused=true;pausedAt=14}

function frame(t){
  // world camera
  const cu=ease(seg(t,10.6,12.0));
  const cx=lerp(STAGE.x,LOGO.x,cu),cy=lerp(STAGE.y,LOGO.y,cu),cs=lerp(STAGE.s,LOGO.s,cu);
  $('world').setAttribute('transform',`translate(${cx},${cy}) scale(${cs})`);
  $('world').setAttribute('opacity',seg(t,0,.6));
  $('ground').setAttribute('opacity',.35*(1-seg(t,10.6,11.2)));
  // hop
  const h=hopAt(t);
  $('hop').setAttribute('transform',`translate(138,346) translate(0,${h.y}) scale(${h.sx},${h.sy}) translate(-138,-346)`);
  // smoke sway
  $('smoke').setAttribute('transform',`rotate(${Math.sin(t*2.2)*7} 139 114)`);
  // puffs after each landing
  PUFFS.forEach((c,i)=>{
    const hp=HOPS[i%3],lt=hp[0]+hp[1]*0.86,u=(t-lt-(i/3|0)*0.07)/1.1;
    if(u<0||u>1){c.setAttribute('r',0);return}
    c.setAttribute('cx',139+Math.sin(i*2.1)*14*u);c.setAttribute('cy',105-u*70-(i/3|0)*6);
    c.setAttribute('r',(4+(i/3|0)*2)*(0.6+u));c.setAttribute('opacity',(1-u)*.8);
  });
  // door
  const o=doorAt(t);
  $('door').setAttribute('transform',`translate(117,0) scale(${1-o*0.92},1) skewY(${-o*8}) translate(-117,0)`);
  // dogs + bubbles
  DOGS.forEach(d=>drawDog(d,t));
  drawBubbles(t);
  // letters drop
  letters.forEach((g,i)=>{
    const u=seg(t,11.3+i*0.14,12.3+i*0.14);
    g.setAttribute('transform',`translate(0,${(1-bounce(u))*-1100})`);
    g.setAttribute('opacity',u>0?1:0);
  });
  villa.forEach((g,i)=>{
    const u=ease(seg(t,12.6+i*0.09,13.2+i*0.09));
    g.setAttribute('transform',`translate(0,${(1-u)*40})`);g.setAttribute('opacity',u);
  });
  const lu=ease(seg(t,13.0,13.8));
  $('lineL').setAttribute('transform',`translate(841,0) scale(${lu},1) translate(-841,0)`);
  $('lineR').setAttribute('transform',`translate(2063,0) scale(${lu},1) translate(-2063,0)`);
}

function loop(now){
  let t=paused?pausedAt:(now-t0)/1000;
  if(!paused&&t>END){t0=now;t=0}
  frame(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__seek=t=>{paused=true;pausedAt=t;frame(t)};

const pb=$('pause');
function setPaused(p){
  const now=performance.now();
  if(p){pausedAt=(now-t0)/1000;if(pausedAt>END)pausedAt=END}else{t0=now-pausedAt*1000}
  paused=p;pb.textContent=p?'再生':'一時停止';
}
if(reduce)pb.textContent='再生';
$('replay').addEventListener('click',()=>{t0=performance.now();paused=false;pb.textContent='一時停止'});
pb.addEventListener('click',()=>setPaused(!paused));
$('stage').addEventListener('click',()=>setPaused(!paused));
})();
</script>

</body>
</html>
